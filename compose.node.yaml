# A single VPN node. Deploy one of these per server; they all pull the same fleet
# identity from the control plane, which is what makes endpoint failover invisible.
#
# Host networking, not a published port. The tunnel port then comes entirely from the fleet
# configuration instead of having to be fixed when the container is created, the agent sees the
# server's real interfaces so NAT masquerades through the right one, and traffic is not NATed
# twice on its way out. The container already holds NET_ADMIN and /dev/net/tun, so it is not
# meaningfully more isolated on a bridge anyway.
#
# ip_forward and src_valid_mark are host settings and cannot be set from a container in this
# mode - scripts/install.sh writes them to /etc/sysctl.d. Set them yourself if you use compose
# directly.
services:
  awg-node:
    image: dihasi/awg-node:latest
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    container_name: awg-node
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      AWG_CONTROL_URL: "${AWG_CONTROL_URL:-}"
      AWG_ENROLLMENT_TOKEN: "${AWG_ENROLLMENT_TOKEN:-}"
      AWG_NODE_STATE_PATH: "/etc/awg-node"
      # awg-quick takes the interface name from the config file's basename while `awg syncconf`
      # is given AWG_INTERFACE, so the path is derived from the name rather than set beside it.
      AWG_INTERFACE: "${AWG_INTERFACE:-awg0}"
      AWG_INTERFACE_CONFIG_PATH: "/etc/amnezia/amneziawg/${AWG_INTERFACE:-awg0}.conf"
      # Leave unset to detect the default-route interface. With host networking that detection
      # sees the real one, so this is only needed for unusual routing setups.
      AWG_EGRESS_INTERFACE: "${AWG_EGRESS_INTERFACE:-}"
      AWG_POLL_INTERVAL_SECONDS: "${AWG_POLL_INTERVAL_SECONDS:-20}"
      # Binds on the host in this mode; change it if 8081 is taken.
      AWG_HEALTH_URL: "${AWG_HEALTH_URL:-http://127.0.0.1:8081}"
      # The agent discovers its own public address and reports it, which is what the panel points
      # the failover record at. Set this only if it cannot - a static NAT in front of the server,
      # say, or a host with no route to the echo services.
      AWG_PUBLIC_IP: "${AWG_PUBLIC_IP:-}"
      # Which echo services to ask. Unset uses the defaults and an explicitly empty value switches
      # discovery off, which compose cannot express with a default - hence the pass-through form:
      # with nothing in .env the variable does not reach the container at all.
      AWG_PUBLIC_IP_URLS:
      AWG_PUBLIC_IP_REFRESH_MINUTES: "${AWG_PUBLIC_IP_REFRESH_MINUTES:-}"
    volumes:
      - awg-node-state:/etc/awg-node
      - awg-node-config:/etc/amnezia/amneziawg

volumes:
  awg-node-state:
  awg-node-config:
