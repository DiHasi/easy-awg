# The control plane. Run this on a host that is NOT one of your VPN nodes: it holds the fleet
# identity, and keeping it off the servers most likely to be blocked or seized is the point.
#
# Put a TLS-terminating reverse proxy in front of it. Agents only make outbound calls, so the
# panel does not need to be reachable from anywhere except your nodes and your browser.
services:
  awg-control:
    image: dihasi/awg-control:latest
    build:
      context: .
      dockerfile: docker/control.Dockerfile
    container_name: awg-control
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080/tcp"
    environment:
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AWG_CONTROL_DB: "/etc/awg-control/control.db"
      AWG_SUBNET: "${AWG_SUBNET:-10.8.0.0/24}"
      AWG_PORT: "${AWG_PORT:-51820}"
      AWG_CLIENT_ALLOWED_IPS: "${AWG_CLIENT_ALLOWED_IPS:-0.0.0.0/0, ::/0}"
      AWG_CLIENT_DNS: "${AWG_CLIENT_DNS:-1.1.1.1, 8.8.8.8}"
      AWG_ENDPOINT_HOST: "${AWG_ENDPOINT_HOST:-}"
      # Creates the first admin on an empty database. Remove once the account exists.
      AWG_ADMIN_USER: "${AWG_ADMIN_USER:-}"
      AWG_ADMIN_PASSWORD: "${AWG_ADMIN_PASSWORD:-}"
      # One-shot adoption of an existing single-server deployment; point at its state.json.
      AWG_IMPORT_LEGACY_STATE: "${AWG_IMPORT_LEGACY_STATE:-}"
      # Manual failover. With a Cloudflare token the panel moves the record itself; without one it
      # records which node is active and shows you the record to set.
      AWG_CLOUDFLARE_API_TOKEN: "${AWG_CLOUDFLARE_API_TOKEN:-}"
      AWG_CLOUDFLARE_ZONE_ID: "${AWG_CLOUDFLARE_ZONE_ID:-}"
      # Defaults to AWG_ENDPOINT_HOST. The TTL is what limits how fast clients follow a switch.
      AWG_DNS_RECORD_NAME: "${AWG_DNS_RECORD_NAME:-}"
      AWG_DNS_TTL: "${AWG_DNS_TTL:-60}"
      # Probes and automatic failover. Everything below is optional: left unset, each falls back
      # to the default the README documents, so the panel behaves the same as before these lines
      # existed. The defaults live in the code rather than here so the two cannot drift.
      #
      # Automatic failover is armed in the panel (Nodes -> Automatic failover) and refuses to arm
      # without the Cloudflare settings above. These decide how reluctant it is once armed.
      AWG_FAILOVER_CHECK_SECONDS: "${AWG_FAILOVER_CHECK_SECONDS:-}"
      AWG_FAILOVER_GRACE_SECONDS: "${AWG_FAILOVER_GRACE_SECONDS:-}"
      AWG_FAILOVER_COOLDOWN_MINUTES: "${AWG_FAILOVER_COOLDOWN_MINUTES:-}"
      # A node that has not reported for this long counts as silent.
      AWG_NODE_STALE_SECONDS: "${AWG_NODE_STALE_SECONDS:-}"
      # Probes are what tell a blocked node from a healthy one, since a blocked node reports
      # itself perfectly healthy. Add them under Nodes -> Probes; these tune their checks.
      AWG_PROBE_INTERVAL_SECONDS: "${AWG_PROBE_INTERVAL_SECONDS:-}"
      AWG_PROBE_STALE_SECONDS: "${AWG_PROBE_STALE_SECONDS:-}"
      AWG_PROBE_HANDSHAKE_TIMEOUT_SECONDS: "${AWG_PROBE_HANDSHAKE_TIMEOUT_SECONDS:-}"
      # What a probe fetches through the tunnel; any answer counts. "none" leaves the handshake
      # as the whole check, which reads the common block - first handshake through, everything
      # after it dropped - as a healthy node.
      AWG_PROBE_CHECK_URLS: "${AWG_PROBE_CHECK_URLS:-}"
      AWG_PROBE_TRAFFIC_TIMEOUT_SECONDS: "${AWG_PROBE_TRAFFIC_TIMEOUT_SECONDS:-}"
      # Where the panel says a node got blocked, went down or recovered, and that traffic moved.
      AWG_NOTIFY_WEBHOOK_URL: "${AWG_NOTIFY_WEBHOOK_URL:-}"
      AWG_NOTIFY_TELEGRAM_BOT_TOKEN: "${AWG_NOTIFY_TELEGRAM_BOT_TOKEN:-}"
      AWG_NOTIFY_TELEGRAM_CHAT_ID: "${AWG_NOTIFY_TELEGRAM_CHAT_ID:-}"
      # Replay protection for a bundle in flight. Deliberately not an expiry on the copy a node
      # cached: that one is re-applied for as long as the panel is unreachable.
      AWG_BUNDLE_LIFETIME_MINUTES: "${AWG_BUNDLE_LIFETIME_MINUTES:-}"
      # How many days of per-peer traffic history the panel keeps for the Traffic page. 0 records
      # none at all; the live counters come from the nodes and keep working either way.
      AWG_USAGE_RETENTION_DAYS: "${AWG_USAGE_RETENTION_DAYS:-}"
    volumes:
      - awg-control-state:/etc/awg-control

volumes:
  awg-control-state:
